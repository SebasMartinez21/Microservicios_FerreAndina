# Levanta todo el sistema desde esta carpeta (app/): docker compose up --build
# Solo el gateway publica un puerto (8000); los microservicios no se ven desde afuera.

name: ferreandina

x-mysql-healthcheck: &mysql-healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
  interval: 5s
  retries: 30
  start_period: 120s   # la primera vez MySQL tarda en iniciar

services:
  # ---------- API Gateway (Laravel) ----------
  gateway:
    build: ./gateway
    ports:
      - "8000:80"
    environment:
      APP_KEY: base64:oR4vk/uGuxn1PetfJt5Was9o/ykCTZpb51dOpSt7Rc0=
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: gateway-db
      DB_PORT: 3306
      DB_DATABASE: gateway
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      GATEWAY_TOKEN: token-interno-ferreandina
    depends_on:
      gateway-db:
        condition: service_healthy

  gateway-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gateway
    volumes:
      - datos-gateway:/var/lib/mysql
    healthcheck: *mysql-healthcheck

  # ---------- Catálogo (Express + MySQL) ----------
  catalogo:
    build:
      context: ..   # la raíz del repo, para copiar el contrato OpenAPI
      dockerfile: app/catalogo/Dockerfile
    environment:
      DB_HOST: catalogo-db
      DB_NAME: catalogo
      DB_USER: root
      DB_PASSWORD: root
      GATEWAY_TOKEN: token-interno-ferreandina
      RABBIT_URL: amqp://rabbitmq
    depends_on:
      catalogo-db:
        condition: service_healthy

  catalogo-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalogo
    volumes:
      - datos-catalogo:/var/lib/mysql
      - ./catalogo/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *mysql-healthcheck

  # ---------- RabbitMQ (eventos entre servicios) ----------
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # panel web para ver colas y mensajes (usuario guest / guest)

  # Para agregar un servicio nuevo (inventario, compras...), copiar el bloque de catalogo
  # y catalogo-db, cambiar los nombres y agregar su volumen abajo.

volumes:
  datos-gateway:
  datos-catalogo:
