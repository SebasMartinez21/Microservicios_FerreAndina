# Levanta todo el sistema desde esta carpeta (app/): docker compose up --build
# Solo el gateway publica un puerto (8000); los microservicios no se ven desde afuera.

name: ferreandina

services:
  # API Gateway (Laravel)
  gateway:
    build:
      context: ..
      dockerfile: app/gateway/Dockerfile
    ports:
      - "8000:80"
    environment:
      APP_KEY: base64:oR4vk/uGuxn1PetfJt5Was9o/ykCTZpb51dOpSt7Rc0=
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: gateway-db
      DB_DATABASE: gateway
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: file
      GATEWAY_TOKEN: token-interno-ferreandina
      JWT_SECRET: clave-de-desarrollo-ferreandina-jwt-2026
    depends_on:
      gateway-db:
        condition: service_healthy

  gateway-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gateway
    volumes:
      - datos-gateway:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  # Catálogo (Express + MySQL)
  catalogo:
    build:
      context: ..
      dockerfile: app/catalogo/Dockerfile
    environment:
      DB_HOST: catalogo-db
      DB_NAME: catalogo
      DB_USER: root
      DB_PASSWORD: root
      GATEWAY_TOKEN: token-interno-ferreandina
      RABBIT_URL: amqp://rabbitmq
    depends_on:
      catalogo-db:
        condition: service_healthy

  catalogo-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalogo
    volumes:
      - datos-catalogo:/var/lib/mysql
      - ./catalogo/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  # Inventario (Express + MySQL)
  inventario:
    build:
      context: ..
      dockerfile: app/inventario/Dockerfile
    environment:
      DB_HOST: inventario-db
      DB_NAME: inventario
      DB_USER: root
      DB_PASSWORD: root
      GATEWAY_TOKEN: token-interno-ferreandina
      RABBIT_URL: amqp://rabbitmq
      CATALOGO_URL: http://catalogo:3000
    depends_on:
      inventario-db:
        condition: service_healthy

  inventario-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario
    volumes:
      - datos-inventario:/var/lib/mysql
      - ./inventario/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  # Compras (Express + MySQL)
  compras:
    build:
      context: ..
      dockerfile: app/compras/Dockerfile
    environment:
      DB_HOST: compras-db
      DB_NAME: compras
      DB_USER: root
      DB_PASSWORD: root
      GATEWAY_TOKEN: token-interno-ferreandina
      RABBIT_URL: amqp://rabbitmq
      CATALOGO_URL: http://catalogo:3000
      INVENTARIO_URL: http://inventario:3000
    depends_on:
      compras-db:
        condition: service_healthy

  compras-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compras
    volumes:
      - datos-compras:/var/lib/mysql
      - ./compras/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  # RabbitMQ (eventos entre servicios)
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # panel web: guest / guest

  # Para agregar un servicio nuevo, copiar el bloque de catalogo y catalogo-db,
  # cambiar los nombres y agregar su volumen abajo.

volumes:
  datos-gateway:
  datos-catalogo:
  datos-inventario:
  datos-compras:
